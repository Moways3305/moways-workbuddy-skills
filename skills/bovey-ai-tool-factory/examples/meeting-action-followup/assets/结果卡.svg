<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">博维 AI 工具工厂会议行动项示范结果卡</title>
  <desc id="desc">虚构会议方法经过 S0 到 S6 后选择单一 Skill，并形成设计、指标和评测合同；宿主仍未验证。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1736"/>
      <stop offset="1" stop-color="#142A55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1170" cy="90" r="180" fill="#27C3A2" opacity="0.10"/>
  <circle cx="80" cy="660" r="210" fill="#5C7CFA" opacity="0.12"/>

  <text x="72" y="76" fill="#8FD8C9" font-size="22" font-family="Microsoft YaHei, sans-serif" letter-spacing="2">BOVEY AI TOOL FACTORY · DRY RUN SHOWCASE</text>
  <text x="72" y="130" fill="#FFFFFF" font-size="42" font-weight="700" font-family="Microsoft YaHei, sans-serif">把会议行动项方法转成可验证 Skill 设计</text>
  <text x="72" y="171" fill="#B8C7E8" font-size="22" font-family="Microsoft YaHei, sans-serif">不是先写 SKILL.md，而是先冻结问题、证据、指标和发布边界</text>

  <g filter="url(#shadow)">
    <rect x="72" y="220" width="350" height="330" rx="24" fill="#FFFFFF"/>
    <rect x="465" y="220" width="350" height="330" rx="24" fill="#FFFFFF"/>
    <rect x="858" y="220" width="350" height="330" rx="24" fill="#FFFFFF"/>
  </g>

  <text x="104" y="268" fill="#4B638E" font-size="18" font-weight="700" font-family="Microsoft YaHei, sans-serif">01 · 输入与约束</text>
  <text x="104" y="317" fill="#10234B" font-size="30" font-weight="700" font-family="Microsoft YaHei, sans-serif">虚构会议记录</text>
  <text x="104" y="365" fill="#50627F" font-size="19" font-family="Microsoft YaHei, sans-serif">只用 synthetic-only 数据</text>
  <text x="104" y="401" fill="#50627F" font-size="19" font-family="Microsoft YaHei, sans-serif">不连接外部系统</text>
  <text x="104" y="437" fill="#50627F" font-size="19" font-family="Microsoft YaHei, sans-serif">不安装、不发送、不发布</text>
  <rect x="104" y="478" width="176" height="42" rx="21" fill="#E9F8F4"/>
  <text x="128" y="506" fill="#127B67" font-size="17" font-weight="700" font-family="Microsoft YaHei, sans-serif">安全边界已显式</text>

  <text x="497" y="268" fill="#4B638E" font-size="18" font-weight="700" font-family="Microsoft YaHei, sans-serif">02 · 形态决策</text>
  <text x="497" y="317" fill="#10234B" font-size="30" font-weight="700" font-family="Microsoft YaHei, sans-serif">选择单一 Skill</text>
  <text x="497" y="365" fill="#50627F" font-size="19" font-family="Microsoft YaHei, sans-serif">Prompt：复用和回归不足</text>
  <text x="497" y="401" fill="#50627F" font-size="19" font-family="Microsoft YaHei, sans-serif">Plugin：尚无多能力集合</text>
  <text x="497" y="437" fill="#50627F" font-size="19" font-family="Microsoft YaHei, sans-serif">MCP：尚无外部连接需求</text>
  <rect x="497" y="478" width="190" height="42" rx="21" fill="#EEF2FF"/>
  <text x="520" y="506" fill="#4057C9" font-size="17" font-weight="700" font-family="Microsoft YaHei, sans-serif">最小充分形态</text>

  <text x="890" y="268" fill="#4B638E" font-size="18" font-weight="700" font-family="Microsoft YaHei, sans-serif">03 · 阶段证据</text>
  <text x="890" y="317" fill="#10234B" font-size="30" font-weight="700" font-family="Microsoft YaHei, sans-serif">S0–S6：7/7</text>
  <text x="890" y="365" fill="#50627F" font-size="19" font-family="Microsoft YaHei, sans-serif">设计、研究与指标合同</text>
  <text x="890" y="401" fill="#50627F" font-size="19" font-family="Microsoft YaHei, sans-serif">5 正向 · 5 负向 · 3 边界</text>
  <text x="890" y="437" fill="#50627F" font-size="19" font-family="Microsoft YaHei, sans-serif">without-skill：5/10 断言</text>
  <rect x="890" y="478" width="230" height="42" rx="21" fill="#FFF2E8"/>
  <text x="913" y="506" fill="#A95B1A" font-size="17" font-weight="700" font-family="Microsoft YaHei, sans-serif">S7–S11 尚未开始</text>

  <line x1="72" y1="606" x2="1208" y2="606" stroke="#38517F" stroke-width="1"/>
  <text x="72" y="654" fill="#FFFFFF" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif">证据等级：dry_run</text>
  <text x="326" y="654" fill="#B8C7E8" font-size="20" font-family="Microsoft YaHei, sans-serif">宿主：not_verified</text>
  <text x="610" y="654" fill="#B8C7E8" font-size="20" font-family="Microsoft YaHei, sans-serif">发布：not_ready</text>
  <text x="890" y="654" fill="#8FD8C9" font-size="20" font-weight="700" font-family="Microsoft YaHei, sans-serif">下一闸门：S7 MVP</text>
</svg>
